# Deploys with Alchemy (alchemy.run.ts) through the shared workflow of samebase/samebase. A push to
# main deploys the stage `prod`. A pull request from this repository deploys the stage
# `pr-<number>` and keeps one comment with its stacks; closing the pull request destroys that stage.
# The state of every stage is on the branch `alchemy-state-store` of this repository:
# `contents: write` lets a run write that branch with its own token, and ALCHEMY_GITHUB_STATE_KEY
# seals each secret in the state. The team token CONVEX_ACCESS_TOKEN mints the deploy keys.
name: Alchemy
on:
  push: { branches: [main] }
  pull_request: { types: [opened, synchronize, reopened, closed] }
  # Run once on main with adopt to take over a project with the name of the repository that
  # exists already.
  workflow_dispatch: { inputs: { adopt: { type: boolean, default: false } } }
permissions: { contents: read }
jobs:
  alchemy:
    uses: samebase/samebase/.github/workflows/alchemy-deploy.yml@bbdd3934972b842de8280206efcaa49288bf8413
    permissions: { contents: write, pull-requests: write }
    with:
      adopt: ${{ inputs.adopt == true }}
      node-version: "26"
    secrets:
      ALCHEMY_ENV: |
        CONVEX_ACCESS_TOKEN=${{ secrets.CONVEX_ACCESS_TOKEN }}
        ALCHEMY_GITHUB_STATE_KEY=${{ secrets.ALCHEMY_GITHUB_STATE_KEY }}
