# Spike: deploys github-state/alchemy.run.ts, stage `ci`, with its Alchemy state on the branch
# `alchemy-state-store` of this repository, through `@samebase/alchemy-github`. The only credentials
# are the run's own token and the key ALCHEMY_GITHUB_STATE_KEY that seals secret values in the
# state.
#
# To deploy the stage `ci`, push the head of `github-state` plus one empty commit to the branch
# `github-state-run`. A push to `github-state` itself would also start the template's pull request
# workflows.
on:
  push:
    branches: [github-state-run]
permissions: { contents: write, issues: write }
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run: { working-directory: github-state }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with: { version: 12.16.1 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: github-state/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Deploy stage ci
        run: pnpm exec alchemy deploy --stage ci --yes --no-input
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ALCHEMY_GITHUB_STATE_KEY: ${{ secrets.ALCHEMY_GITHUB_STATE_KEY }}
